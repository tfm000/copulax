[project]
name = "copulax"
version = "3.0.0"
description = "Copula, multivariate and univariate distribution fitting using JAX in python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "Sklar",
    "Copula",
    "Copulas",
    "Copulae",
    "Probability",
    "Distribution",
    "Univariate",
    "Bivariate",
    "Multivariate",
    "Joint",
    "CDF",
    "PDF",
    "Modeling",
    "Quantitative",
    "Fitting",
    "SciPy",
    "Statistics",
    "Mathematics",
    "Science",
    "Scientific",
    "Finance",
    "Risk",
    "VaR",
    "Machine Learning",
    "Variables",
    "JAX",
]
authors = [{ name = "Tyler Mitchell", email = "tylerfmitchell1999@gmail.com" }]
maintainers = [
    { name = "Tyler Mitchell", email = "tylerfmitchell1999@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "jax>=0.4.38,<0.7; python_version < '3.11'",
    "jax>=0.4.38; python_version >= '3.11'",
    "optax>=0.2.4",
    "quadax>=0.2.8",
    "interpax>=0.3.7",
    "matplotlib>=3.9.2",
    "numpy>=1.24",
    "equinox>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "build",
    "twine",
    "arch>=8,<9",
    "statsmodels>=0.14.4,<0.16",
    # arch 8 supports numpy 2.4+ and pandas 3+, so the pandas 2.x cap is dropped.
    # scipy floor is the oldest release covering {Python 3.10-3.13, numpy 2.x}.
    "scipy>=1.14",
    "pandas>=2.0",
    # Required by test_export.py: the jax.export serialization round-trips
    # deserialize via flatbuffers. Without it that module is skipped whole,
    # silently dropping the export-compatibility coverage in fresh envs.
    "flatbuffers>=25",
    # Within-leg test parallelism (-n / --dist), used by the CI test legs.
    # Declared rather than assumed present: an undeclared plugin is simply
    # absent in a fresh environment, and the run gets quietly slower with
    # nothing to say so -- the same silent-degradation shape as flatbuffers.
    "pytest-xdist>=3.6,<4",
    # ruff and mypy gate a required CI context, so both carry upper caps.
    # ruff is pre-1.0 and changes rule behaviour across minors; mypy adds
    # checks across minors too. Uncapped, an unrelated upstream release
    # turns a required context red on a pull request that changed nothing.
    # The static-checks job installs ".[dev]" so it gets exactly these.
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
]

docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0", "sphinx-autodoc-typehints>=2.0"]

examples = ["yfinance>=1.3.0"]

[project.urls]
"Homepage" = "https://github.com/tfm000/copulax"
"Documentation" = "https://copulax.readthedocs.io"
"Bug Reports" = "https://github.com/tfm000/copulax/issues"
"Source" = "https://github.com/tfm000/copulax"

[build-system]
requires = ["setuptools>=65.0.0", "wheel>=0.38"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# We control sdist contents via MANIFEST.in and wheel contents via the
# packages.find directive below. Setting include-package-data = false
# stops MANIFEST.in entries (specifically the test suite) from being
# pulled into the wheel as package data -- they belong in the sdist
# only.
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["copulax*"]
exclude = ["copulax.tests*"]
namespaces = true

[tool.coverage.run]
# Measure the library, not the suite that exercises it. The tests' own
# coverage is noise, and the _r_reference regenerators sit at 0% by design
# -- they shell out to R and are guarded by the frozen-corpus SHA-256
# tripwire in test_timeseries_corpus.py, which is a far stronger check than
# a coverage line would be. Both live under copulax/tests/, so the single
# pattern covers them and no separate _r_reference pattern is needed. The
# second pattern is the same directory as an installed package, so a run
# against site-packages scopes identically. Scoping lives here rather than
# in the CI invocation so that a local `pytest --cov` and the CI coverage
# leg report the same numbers -- the same split already expressed above by
# the packages.find exclude.
source = ["copulax"]
omit = ["copulax/tests/*", "*/copulax/tests/*"]

[tool.ruff]
# 88 and py310 are ruff's own resolved defaults for this project (the
# target version is inferred from requires-python), so writing them down
# changes no formatting -- the one-time format commit stays check-clean.
line-length = 88
target-version = "py310"
src = ["."]
# The _r_reference *_data.py modules are machine-generated reference data,
# rewritten wholesale by the R and python regenerators sitting beside them.
# None of those regenerators emits formatted output, so without this
# exclusion the next regeneration re-reds the format gate with a diff no
# reviewer can read: reformatting alone re-wraps the numeric literals one
# per line and takes frozen_series_data.py from 1.8 MB to 2.8 MB. The
# regenerators themselves are hand-written and stay in scope. extend-
# exclude rather than exclude, so ruff's built-in exclusions (.venv, .git,
# build, dist) survive.
extend-exclude = ["copulax/tests/_r_reference/*_data.py"]
# Honour that exclusion even when a path is handed to ruff explicitly, so
# an editor or hook that formats single files cannot quietly reintroduce
# the drift the exclusion exists to prevent.
force-exclude = true

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = [
    # Ambiguous-unicode rules. This library's docstrings, comments and
    # strings carry mathematical notation on purpose -- Greek parameter
    # names, the U+2212 minus and the U+00D7 times sign are house style,
    # and the docstring hardening work ahead strengthens that notation
    # rather than laundering it into ASCII lookalikes.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Re-exports ARE the public API here: every subpackage surfaces its
# distributions through __init__.py. An unused-import or star-import
# finding in one is therefore never a defect, and autofixing one would
# silently shrink the public surface.
"copulax/**/__init__.py" = ["F401", "F403"]
# jax.config.update("jax_enable_x64", True) must run before jax.numpy is
# imported or the suite traces in float32. The module-level statement
# ahead of the imports is deliberate and commented at the site.
"copulax/tests/conftest.py" = ["E402"]
# The same pre-import x64 pattern appears in several test modules.
"copulax/tests/*.py" = ["E402"]

[tool.ruff.lint.isort]
# Without this copulax sorts as third-party, and I001 would then demand the
# opposite of the stdlib -> third-party -> local order the house style sets.
known-first-party = ["copulax"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
# Leave doctest bodies alone -- several lay mathematical expressions out
# for readability. This matches ruff's default, so the setting states an
# intent without changing what the formatter does.
docstring-code-format = false

[tool.mypy]
# Analyse against the requires-python floor rather than whichever
# interpreter runs the job. The static-checks leg runs on 3.13; unpinned,
# it would wave through a 3.11+-only construct that the 3.10 test legs
# still have to import.
python_version = "3.10"
files = ["copulax"]
# The library only, this phase. Type-checking the test suite is a separate
# wave of its own with far less payoff per error; it is tracked as pending
# work rather than dropped.
exclude = 'copulax/tests/'
# Deliberately NOT strict = true. strict also enables warn_return_any,
# which reports no-any-return on every jax.tree.map and eqx.tree_at return
# in the library -- a false-positive class with no narrow suppression --
# whereas the requirement being met here is exactly disallow_untyped_defs
# across the package. Setting that flag directly buys the requirement
# without the noise.
disallow_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true

# optax is the only runtime dependency shipping no py.typed marker; jax,
# jaxlib, equinox, numpy, matplotlib, quadax and interpax all ship one.
# Scoping ignore_missing_imports to optax alone keeps genuine errors in the
# typed integrations visible, which a blanket setting would hide.
[[tool.mypy.overrides]]
module = ["optax", "optax.*"]
ignore_missing_imports = true
